<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Жизнь после Ядерного взрыва — Арсений Ситников</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #3a2a1a 0%, #1a120b 60%, #0a0705 100%);
    font-family: 'Georgia', 'Times New Roman', serif;
    padding: 30px 15px;
    overflow-x: hidden;
  }

  .book {
    position: relative;
    width: 900px;
    max-width: 100%;
    height: 640px;
    perspective: 2000px;
  }

  .book-inner {
    position: relative;
    width: 100%;
    height: 100%;
    background: #f5ecd7;
    border-radius: 6px 12px 12px 6px;
    box-shadow:
      0 0 0 4px #5a0e0e,
      0 0 0 8px #7a1414,
      0 0 0 10px #c9a227,
      0 30px 60px rgba(0, 0, 0, 0.8),
      inset 0 0 80px rgba(90, 14, 14, 0.15);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .book-inner::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 26px;
    height: 100%;
    background: linear-gradient(to right, #4a0a0a, #7a1414 40%, #5a0e0e 70%, #3a0808);
    box-shadow: inset -3px 0 8px rgba(0, 0, 0, 0.6);
    z-index: 3;
  }

  .book-inner::after {
    content: '';
    position: absolute;
    top: 0;
    left: 26px;
    width: 2px;
    height: 100%;
    background: linear-gradient(to bottom, transparent, #c9a227, transparent);
    opacity: 0.6;
    z-index: 3;
  }

  .page {
    position: relative;
    flex: 1;
    padding: 50px 60px 90px 70px;
    overflow-y: auto;
    z-index: 2;
    transition: opacity 0.4s ease;
    background:
      linear-gradient(to right, rgba(90, 14, 14, 0.08) 0%, transparent 8%),
      #f5ecd7;
  }

  .page.fade {
    opacity: 0;
  }

  .page::-webkit-scrollbar {
    width: 8px;
  }
  .page::-webkit-scrollbar-track {
    background: rgba(90, 14, 14, 0.05);
  }
  .page::-webkit-scrollbar-thumb {
    background: #a83232;
    border-radius: 4px;
  }

  .title-page {
    text-align: center;
    padding-top: 40px;
  }

  .title-page h1 {
    font-size: 42px;
    color: #5a0e0e;
    letter-spacing: 2px;
    line-height: 1.3;
    text-shadow: 1px 1px 0 #c9a227, 2px 2px 4px rgba(0, 0, 0, 0.2);
    margin-bottom: 30px;
    font-weight: 700;
  }

  .title-page .divider {
    width: 200px;
    height: 2px;
    margin: 0 auto 30px;
    background: linear-gradient(to right, transparent, #c9a227, transparent);
    position: relative;
  }

  .title-page .divider::before,
  .title-page .divider::after {
    content: '❖';
    position: absolute;
    top: -12px;
    color: #c9a227;
    font-size: 16px;
  }
  .title-page .divider::before { left: -20px; }
  .title-page .divider::after { right: -20px; }

  .title-page .author {
    font-size: 22px;
    color: #7a1414;
    font-style: italic;
    margin-bottom: 8px;
  }

  .title-page .author-name {
    font-size: 26px;
    color: #3a0808;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 40px;
  }

  .title-page .preface-label {
    font-size: 18px;
    color: #a83232;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 15px;
  }

  .title-page .preface {
    font-size: 16px;
    color: #3a2a1a;
    line-height: 1.8;
    text-align: left;
    max-width: 600px;
    margin: 0 auto;
  }

  .title-page .preface p {
    margin-bottom: 14px;
    text-indent: 30px;
  }

  .chapter h2 {
    font-size: 26px;
    color: #5a0e0e;
    text-align: center;
    margin-bottom: 30px;
    letter-spacing: 1px;
    text-shadow: 1px 1px 0 rgba(201, 162, 39, 0.4);
  }

  .chapter p {
    font-size: 16.5px;
    line-height: 1.85;
    color: #2a1f14;
    margin-bottom: 16px;
    text-indent: 35px;
    text-align: justify;
  }

  .chapter .first-line {
    text-indent: 35px;
  }

  .page-number {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #a83232;
    letter-spacing: 2px;
    z-index: 4;
  }

  .nav-btn {
    position: absolute;
    bottom: 18px;
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #a83232, #5a0e0e 70%);
    color: #f0d98a;
    font-size: 22px;
    cursor: pointer;
    box-shadow:
      0 3px 10px rgba(0, 0, 0, 0.5),
      inset 0 1px 2px rgba(255, 255, 255, 0.2);
    transition: all 0.25s ease;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    font-family: 'Georgia', serif;
  }

  .nav-btn:hover:not(:disabled) {
    background: radial-gradient(circle at 35% 30%, #c94040, #7a1414 70%);
    transform: scale(1.08);
    box-shadow:
      0 5px 16px rgba(0, 0, 0, 0.6),
      inset 0 1px 3px rgba(255, 255, 255, 0.3),
      0 0 20px rgba(201, 162, 39, 0.3);
  }

  .nav-btn:active:not(:disabled) {
    transform: scale(0.96);
  }

  .nav-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    filter: grayscale(0.5);
  }

  .nav-btn.prev {
    left: 34px;
  }

  .nav-btn.next {
    right: 22px;
  }

  .nav-btn span {
    display: block;
    transform: translateY(-1px);
  }

  @media (max-width: 700px) {
    .book { height: 560px; }
    .page { padding: 35px 25px 85px 40px; }
    .title-page h1 { font-size: 28px; }
    .title-page .author-name { font-size: 20px; }
    .chapter h2 { font-size: 20px; }
    .chapter p { font-size: 15px; }
    .nav-btn { width: 44px; height: 44px; font-size: 18px; }
    .nav-btn.prev { left: 18px; }
    .nav-btn.next { right: 10px; }
  }
</style>
</head>
<body>

<div class="book">
  <div class="book-inner">
    <div class="page" id="page"></div>

    <button class="nav-btn prev" id="prevBtn" title="Назад" aria-label="Предыдущая страница">
      <span>&#10094;</span>
    </button>
    <button class="nav-btn next" id="nextBtn" title="Вперёд" aria-label="Следующая страница">
      <span>&#10095;</span>
    </button>

    <div class="page-number" id="pageNum">1</div>
  </div>
</div>

<script>
  const pages = [
    `
<div class="title-page">
  <h1>Жизнь после<br>Ядерного взрыва</h1>
  <div class="divider"></div>
  <div class="author">Автор</div>
  <div class="author-name">Арсений Ситников</div>
  <div class="preface-label">Предисловие</div>
  <div class="preface">
    <p>В этой книге я описал то, что произошло со мной и моими друзьями после ядерного взрыва. Это история о том, как выжить, когда весь мир вокруг рушится. О том, как найти в себе силы идти дальше, когда кажется, что всё кончено. О том, как помогать другим и не сдаваться.</p>
    <p>Я не писатель. Мне четырнадцать лет. Но я видел это своими глазами. И я хочу, чтобы вы знали: даже после самого страшного конца — есть начало. Жизнь продолжается. Главное — не оставаться одному.</p>
    <p>Эта книга — для всех, кто хочет понять, как жить после ядерного взрыва. И для тех, кто просто хочет узнать мою историю.</p>
  </div>
</div>
`,

`
<div class="chapter">
  <h2>Глава 1. Мальчик, который не пошёл в школу</h2>
  <p class="first-line">Меня зовут Арсений. Мне четырнадцать лет. И я, наверное, самый везучий человек на Земле. Или самый несчастный — я до сих пор не решил.</p>
  <p>В тот день я не пошёл в школу. Просто не пошёл — проспал, а потом сказал маме, что голова болит. Она поверила, поцеловала меня в лоб и ушла на работу. Работала она в центре города, в банке. Папа был в командировке, в другом городе. Я остался один в квартире.</p>
  <p>Я лежал на диване, листал телефон, слушал музыку в наушниках. За окном было обычное утро — серое, осеннее, скучное. Ничего не предвещало.</p>
  <p>А потом завыла сирена.</p>
  <p>Я сначала не понял. Долгий, протяжный вой, как на учениях. Только громче. Намного громче. Он шёл отовсюду — с улицы, из телефона, из наушников. Я снял наушники. Сирена не прекращалась. Она давила на уши, на грудь, на мозг.</p>
  <p>Я подбежал к окну. На улице люди бежали. Кто-то падал. Машины сигналили, но их заглушал этот вой. Я смотрел и не понимал, что происходит. Мы же в мире. Война где-то там, далеко. Не у нас.</p>
  <p>Потом я увидел вспышку.</p>
  <p>Не в окне — за окном. На горизонте, в стороне центра. Белая, яркая, как будто кто-то зажёг второе солнце. Я не успел даже подумать. Просто смотрел, как эта белая стена растёт, приближается, идёт ко мне.</p>
  <p>А потом свет поглотил всё.</p>
  <p>Удар. Меня отбросило от окна. Стекло лопнуло, но не разлетелось — оно просто треснуло, как паутина. Я упал на пол, на спину. В ушах звенело так, что я не слышал даже своего крика. В груди сжалось, я не мог вдохнуть. Всё вокруг стало белым, потом серым, потом тёмным.</p>
  <p>Я лежал на полу и не понимал, жив ли я.</p>
  <p>Сирена стихла. Не сразу — она захлебнулась, оборвалась на середине воя, как будто кто-то выдернул провод. И стало тихо. Так тихо, что я услышал, как капает вода из крана на кухне.</p>
  <p>Я лежал, наверное, минут десять. Может, больше. Тело болело, но я мог двигаться. Медленно встал. Коленки дрожали. Подошёл к окну — оно было выбито, рама перекошена. Я выглянул.</p>
  <p>И не понял, что вижу.</p>
  <p>Город был серым. Не чёрным, не горящим — просто серым, как старая фотография. Дома стояли, но некоторые были сломаны, как игрушечные. Деревья — голые, обугленные. Машин на улице не было видно, только несколько сгоревших корпусов. А люди... Люди лежали. На тротуарах, на газонах, у подъездов. Много. Они не двигались.</p>
  <p>Я отшатнулся от окна. Сердце колотилось так, что болела грудь. Я не хотел смотреть. Но не смотреть не мог.</p>
  <p>Я взял телефон. Экран светился, но сети не было. Ни одной палочки. Я набрал маму — гудки, потом сброс. Набрал папу — то же самое. Позвонил в скорую — ничего. Я сидел на полу и нажимал на кнопки, пока телефон не разрядился. Тогда я заплакал. Впервые за всё это время. Просто сидел на холодном полу, в осколках, и плакал, как маленький.</p>
  <p>Мне четырнадцать. Я не должен быть один. Но я был.</p>
</div>
`,

`
<div class="chapter">
  <h2>Глава 2. Первый шаг</h2>
  <p class="first-line">Я не помню, сколько прошло времени. Может, час. Может, три. За окном всё так же висел серый свет. Ни солнца, ни луны — просто мутная пелена. Я сидел на кухне, пил воду прямо из бутылки и пытался думать.</p>
  <p>Первая мысль: надо найти маму. Она в центре, это далеко, но я дойду. Вторая мысль: а если её нет? Третья мысль: а если есть, но не может двигаться? Четвёртая: а если я тоже умру, если выйду на улицу?</p>
  <p>Я надел кроссовки. Куртку. Взял рюкзак, кинул туда бутылку воды, печенье, аптечку, которая была в шкафу. Нашёл папин старый фонарик. Нож. Не знаю зачем, но взял. Посмотрел на себя в зеркало — бледный, глаза красные, волосы торчат. Обычный пацан. Только в глазах что-то новое. Страх.</p>
  <p>Я вышел из квартиры. Подъезд был тёмный, лампочки не горели. Я спускался по лестнице, держась за перила. На третьем этаже дверь была открыта. Я заглянул — пусто. На первом этаже лежала соседка, тётя Люда. Она всегда угощала меня конфетами. Я не стал смотреть. Просто прошёл мимо.</p>
  <p>На улице пахло гарью. И ещё чем-то сладким, тошным. Я не хотел понимать, чем. Я шёл по дороге, обходя машины. Асфальт был усыпан стеклом. Ветер гнал пыль. Ни одного звука, кроме моих шагов.</p>
  <p>Я дошёл до перекрёстка и остановился. Впереди был город. Мой город. Но не мой. Он был мёртвый. И я понял, что не знаю, куда идти. Куда угодно. Лишь бы не стоять.</p>
  <p>Я выбрал направление — в сторону центра. К маме. И пошёл.</p>
</div>
`,

`
<div class="chapter">
  <h2>Глава 3. Девочка в окне</h2>
  <p class="first-line">Я шёл уже часа два. Ноги гудели, но я не останавливался. Мимо проплывали дома, магазины, школа. Наша школа. Окна выбиты, дверь сорвана. Я не стал заходить.</p>
  <p>На улице Ленина я увидел первое движение. Не ветку, не пакет — человека. Девочку. Она стояла в окне второго этажа и смотрела на меня. Лет двенадцать, может, меньше. Рыжая, в зелёной куртке. Я остановился. Она тоже не двигалась.</p>
  <p>Я поднял руку. Помахал. Она отшатнулась, но не ушла. Я крикнул:</p>
  <p>— Эй! Ты живая?</p>
  <p>Глупый вопрос. Но она кивнула.</p>
  <p>— Я Арсений! — крикнул я. — Ты одна?</p>
  <p>Она помолчала. Потом открыла окно и сказала тихо, но я услышал:</p>
  <p>— Да. Мама ушла и не вернулась.</p>
  <p>Я стоял и не знал, что сказать. У меня тоже мама ушла. Но моя хотя бы не вернулась из центра. А её — просто ушла.</p>
  <p>— Спускайся, — сказал я. — Пойдём вместе.</p>
  <p>Она посмотрела на меня. Долго. Потом закрыла окно. Через минуту вышла из подъезда. Худая, бледная, с рюкзаком. Подошла ко мне. Мы стояли друг напротив друга. Двое детей в мёртвом городе.</p>
  <p>— Меня зовут Лиза, — сказала она.</p>
  <p>— Арсений, — ответил я. — Пойдём искать живых.</p>
  <p>Она кивнула. И мы пошли. Вдвоём. Уже не так страшно.</p>
</div>
`,

    <div class="chapter">
      <h2>Глава 4. Магазин на углу</h2>
      <p class="first-line">Мы шли молча. Лиза держалась рядом, но не близко — на расстоянии вытянутой руки. Иногда она оглядывалась назад, будто ждала, что кто-то пойдёт следом. Но сзади была только пустая улица.</p>
      <p>Мы дошли до угла, где раньше был магазин «Пятёрочка». Дверь была приоткрыта, стекло выбито. Внутри темно, но не полностью — свет с улицы попадал через витрины.</p>
      <p>— Надо зайти, — сказал я. — Воды возьмём. Еды.</p>
      <p>Лиза кивнула. Мы вошли.</p>
      <p>Внутри пахло испорченным молоком и пылью. Полки были перевёрнуты. Я взял корзинку и пошёл вдоль рядов. Вода в бутылках — целая. Печенье, консервы, шоколад. Лиза стояла у входа и смотрела на улицу.</p>

      <p>— Это не учения, — сказала Лиза. — Это война. Настоящая.</p>

    `
    <div class="chapter">
      <h2>Глава 5. Знак на стене</h2>
      <p class="first-line">Мы шли ещё час. Улицы становились всё более разрушенными. Дома здесь были ближе к эпицентру. Я старался не смотреть на то, что лежало на тротуарах. Но всё равно видел.</p>
      <p>На перекрёстке я остановился. Достал карту. Я посмотрел на схему и увидел значок — маленький чёрный треугольник с буквой «У». Убежище.</p>
      <p>— Вот, — сказал я. — Здесь. Под зданием администрации.</p>
      <p>Здание администрации было высоким, серым, с колоннами. Оно уцелело — почти. Я подбежал к главному входу. Двери были заперты.</p>
      <p>— С другой стороны, — сказала Лиза. — Там был вход в подвал.</p>
      <p>Мы обошли здание. Сзади была низкая железная дверь. Она была приоткрыта. За ней — лестница вниз. Темно.</p>
      <p>Мы спустились. Внизу была длинная комната с низким потолком. Кровати, столы, ящики. На стене — старый плакат с инструкцией по гражданской обороне. Никого.</p>
      <p>— Здесь никого нет, — сказала Лиза.</p>
      <p>— Значит, будем мы, — ответил я.</p>
      <p>Я закрыл дверь. Нашёл засов. Задвинул. Теперь мы были внутри. В безопасности. Насколько это возможно.</p>

      <p>Она сидела у палатки в дальнем конце лагеря. Худая, бледная. Рыжая. Лиза остановилась. Замерла.</p>
      <p>— Мама? — сказала она тихо.</p>
      <p>Женщина подняла голову. И встала.</p>
      <p>— Лиза? — выдохнула она.</p>
      <p>Лиза побежала. Через весь лагерь. Она обняла её. И заплакала. Громко, навзрыд.</p>
      <p>Я стоял и смотрел. Мама подошла сзади. Положила руку мне на плечо.</p>
      <p>— Нашла, — сказала она.</p>
      <p>— Да. Нашла.</p>
      <p>Вечером мы сидели у костра. Все вместе. Я, мама, Лиза, её мама, Виктор с семьёй. Ели тушёнку. Пили чай.</p>
      <p>Лиза сидела рядом со своей мамой. Держала её за руку.</p>
      <p>Я смотрел на них. И думал: мы все кого-то искали. Кто-то нашёл. Кто-то нет. Но мы здесь. Мы вместе. Мы живы.</p>
      <p>Мне четырнадцать. Я выжил. Мы выжили. И это — главное.</p>
      <h2 style="margin-top:40px;">Конец</h2>
      <p style="text-align:center; text-indent:0; margin-top:20px; font-style:italic; color:#7a1414;">Автор: Арсений Ситников, 14 лет</p>
    </div>
    `
  ];

  let currentPage = 0;

  const pageEl = document.getElementById('page');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pageNumEl = document.getElementById('pageNum');

  function renderPage() {
    pageEl.classList.add('fade');
    setTimeout(() => {
      pageEl.innerHTML = pages[currentPage];
      pageEl.scrollTop = 0;
      pageEl.classList.remove('fade');
      pageNumEl.textContent = currentPage + 1;
      prevBtn.disabled = currentPage === 0;
      nextBtn.disabled = currentPage === pages.length - 1;
    }, 200);
  }

  prevBtn.addEventListener('click', () => {
    if (currentPage > 0) {
      currentPage--;
      renderPage();
    }
  });

  nextBtn.addEventListener('click', () => {
    if (currentPage < pages.length - 1) {
      currentPage++;
      renderPage();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' && currentPage > 0) {
      currentPage--;
      renderPage();
    } else if (e.key === 'ArrowRight' && currentPage < pages.length - 1) {
      currentPage++;
      renderPage();
    }
  });

  renderPage();
</script>

</body>
</html>
